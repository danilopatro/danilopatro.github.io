        :root {
            --ring-gold: #b45309;
            --ring-gold-hover: #92400e;
            --bg-light: #f1f5f9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: #1e293b;
        }

        .font-fantasy {
            font-family: 'Cinzel', serif;
        }

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0; 
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--ring-gold); 
        }

        /* Fantasy Checkbox Styling for Light Theme */
        .checkbox-fantasy {
            appearance: none;
            background-color: #ffffff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.25em;
            height: 1.25em;
            border: 2px solid #94a3b8;
            border-radius: 0.3em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            flex-shrink: 0;
        }

        .checkbox-fantasy::before {
            content: "";
            width: 0.7em;
            height: 0.7em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #b45309;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .checkbox-fantasy:checked::before {
            transform: scale(1);
        }

        .checkbox-fantasy:checked {
            border-color: #b45309;
            background-color: #fffbeb;
        }

        /* Tree Branch Styling */
        .tree-branch {
            position: relative;
        }
        .tree-branch::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 0;
            bottom: 50%;
            width: 2px;
            background-color: #cbd5e1;
        }
        .tree-branch::after {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            width: 10px;
            height: 2px;
            background-color: #cbd5e1;
        }
        .tree-branch:last-child::before {
            bottom: 50%;
        }
    </style>
</head>

        const ALL_PACKS_FLAT = CYCLES_DATA.flatMap(cycle => 
            cycle.packs.map(p => ({ ...p, cycleName: cycle.cycleName, cycleCode: cycle.cycleCode, cycleColor: cycle.color }))
        ).sort((a, b) => a.release_date.localeCompare(b.release_date));

        let selectedPackCodes = new Set();
        let collapsedTreeNodes = new Set();

        function renderPacks(searchTerm = '') {
            const container = document.getElementById('packs-container');
            container.innerHTML = '';

            const term = searchTerm.toLowerCase().trim();

            CYCLES_DATA.forEach(cycle => {
                const matchingPacks = cycle.packs.filter(p => 
                    p.name.toLowerCase().includes(term) || 
                    p.code.toLowerCase().includes(term) ||
                    cycle.cycleName.toLowerCase().includes(term)
                );

                if (matchingPacks.length === 0) return;

                const cycleCard = document.createElement('div');
                cycleCard.className = 'border rounded-2xl p-5 shadow-md overflow-hidden relative transition-all duration-300';
                
                // Light pastel tint version of cycle color for element background
                const cardBgColor = cycle.color === '#000000' ? '#f8fafc' : `${cycle.color}0d`;
                const cardBorderColor = cycle.color === '#000000' ? '#cbd5e1' : `${cycle.color}35`;
                cycleCard.style.backgroundColor = cardBgColor;
                cycleCard.style.borderColor = cardBorderColor;
                cycleCard.style.borderLeft = `6px solid ${cycle.color === '#000000' ? '#475569' : cycle.color}`;

                // Cycle Header
                const cycleHeader = document.createElement('div');
                cycleHeader.className = 'flex flex-col sm:flex-row sm:items-center justify-between pb-3.5 mb-4 border-b border-slate-200/80 gap-2';

                const cycleTitle = document.createElement('div');
                cycleTitle.className = 'flex items-center gap-2.5';

                const colorDot = document.createElement('span');
                colorDot.className = 'w-3.5 h-3.5 rounded-full shrink-0 shadow-sm border border-black/10';
                colorDot.style.backgroundColor = cycle.color === '#000000' ? '#475569' : cycle.color;

                cycleTitle.appendChild(colorDot);

                const titleText = document.createElement('h2');
                titleText.className = 'font-fantasy text-lg sm:text-xl font-bold tracking-wide';
                titleText.style.color = cycle.color === '#000000' ? '#1e293b' : cycle.color;
                titleText.innerText = cycle.cycleName;
                cycleTitle.appendChild(titleText);

                const codeBadge = document.createElement('span');
                codeBadge.className = 'text-xs font-mono font-bold px-2 py-0.5 rounded border';
                codeBadge.style.backgroundColor = `${cycle.color}15`;
                codeBadge.style.borderColor = `${cycle.color}40`;
                codeBadge.style.color = cycle.color === '#000000' ? '#334155' : cycle.color;
                codeBadge.innerText = cycle.cycleCode;
                cycleTitle.appendChild(codeBadge);

                // Cycle toggle button
                const cycleAllSelected = cycle.packs.every(p => selectedPackCodes.has(p.code));
                const cycleToggleBtn = document.createElement('button');
                cycleToggleBtn.className = 'text-xs font-semibold text-slate-600 hover:text-amber-700 transition-colors self-start sm:self-auto bg-slate-100 hover:bg-amber-50 px-3 py-1.5 rounded-lg border border-slate-200';
                cycleToggleBtn.innerText = cycleAllSelected ? 'Deselect Cycle' : 'Select Cycle';
                cycleToggleBtn.addEventListener('click', () => toggleCycle(cycle, !cycleAllSelected));

                cycleHeader.appendChild(cycleTitle);
                cycleHeader.appendChild(cycleToggleBtn);
                cycleCard.appendChild(cycleHeader);

                // Packs Grid
                const packsGrid = document.createElement('div');
                packsGrid.className = 'grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3.5';

                cycle.packs.forEach(pack => {
                    const isVisible = matchingPacks.some(mp => mp.code === pack.code);
                    if (!isVisible) return;

                    const packLabel = document.createElement('label');
                    const isChecked = selectedPackCodes.has(pack.code);
                    
                    const activeColor = cycle.color === '#000000' ? '#3b82f6' : cycle.color;
                    const textCycleColor = cycle.color === '#000000' ? '#1e293b' : cycle.color;

                    if (isChecked) {
                        packLabel.className = 'flex items-center gap-3.5 p-3.5 rounded-xl border transition-all cursor-pointer shadow-sm group';
                        packLabel.style.backgroundColor = `${activeColor}22`;
                        packLabel.style.borderColor = activeColor;
                    } else {
                        packLabel.className = 'flex items-center gap-3.5 p-3.5 rounded-xl border transition-all cursor-pointer shadow-sm group hover:border-amber-400';
                        packLabel.style.backgroundColor = cycle.color === '#000000' ? '#ffffff' : `${activeColor}0a`;
                        packLabel.style.borderColor = `${activeColor}25`;
                    }

                    packLabel.innerHTML = `
                        <input type="checkbox" class="checkbox-fantasy" ${isChecked ? 'checked' : ''} data-code="${pack.code}">
                        <div class="flex flex-col min-w-0 flex-1">
                            <span class="text-sm font-bold leading-tight transition-colors" style="color: ${textCycleColor}">${pack.name}</span>
                            <div class="flex items-center gap-2 text-xs text-slate-500 mt-1 font-mono font-medium">
                                <span class="bg-slate-200/80 px-1.5 py-0.2 rounded text-[11px] font-bold" style="color: ${textCycleColor}">e:${pack.code}</span>
                                <span>•</span>
                                <span>${pack.release_date}</span>
                            </div>
                        </div>
                    `;

                    const checkbox = packLabel.querySelector('input');
                    checkbox.addEventListener('change', (e) => handlePackToggle(pack, e.target.checked));

                    packsGrid.appendChild(packLabel);
                });

                cycleCard.appendChild(packsGrid);
                container.appendChild(cycleCard);
            });

            if (container.children.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-500 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <p class="text-sm font-medium">No packs or cycles matching "${searchTerm}"</p>
                    </div>
                `;
            }

            updateFilterOutput();
            renderSelectedTree();
        }

        function handlePackToggle(pack, isChecked) {
            const isProgression = document.getElementById('progression-mode').checked;

            if (isChecked) {
                if (isProgression) {
                    ALL_PACKS_FLAT.forEach(p => {
                        if (p.release_date <= pack.release_date) {
                            selectedPackCodes.add(p.code);
                        }
                    });
                } else {
                    selectedPackCodes.add(pack.code);
                }
            } else {
                selectedPackCodes.delete(pack.code);
            }

            renderPacks(document.getElementById('pack-search').value);
        }

        function toggleCycle(cycle, select) {
            cycle.packs.forEach(p => {
                if (select) {
                    selectedPackCodes.add(p.code);
                } else {
                    selectedPackCodes.delete(p.code);
                }
            });
            renderPacks(document.getElementById('pack-search').value);
        }

        function renderSelectedTree() {
            const treeContainer = document.getElementById('selected-tree-container');
            const badge = document.getElementById('selected-count-badge');
            badge.innerText = selectedPackCodes.size;

            treeContainer.innerHTML = '';

            if (selectedPackCodes.size === 0) {
                treeContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center py-10 px-4 text-slate-400 rounded-xl bg-slate-50 border border-slate-200 border-dashed">
                        <svg class="w-8 h-8 text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
                        <p class="text-xs font-semibold text-slate-500">No sets selected</p>
                        <p class="text-[11px] text-slate-400 mt-1 font-medium">Select packs on the left to build your tree</p>
                    </div>
                `;
                return;
            }

            CYCLES_DATA.forEach(cycle => {
                const selectedPacksInCycle = cycle.packs.filter(p => selectedPackCodes.has(p.code));
                if (selectedPacksInCycle.length === 0) return;

                const isCollapsed = collapsedTreeNodes.has(cycle.cycleCode);

                const cycleTreeNode = document.createElement('div');
                cycleTreeNode.className = 'bg-white border rounded-xl overflow-hidden shadow-sm transition-all';
                
                const nodeBorderColor = cycle.color === '#000000' ? '#475569' : cycle.color;
                cycleTreeNode.style.borderColor = `${nodeBorderColor}50`;

                // Cycle Node Header
                const cycleHeader = document.createElement('div');
                cycleHeader.className = 'flex items-center justify-between px-3 py-2 bg-slate-50/80 cursor-pointer hover:bg-slate-100 transition-colors select-none border-b border-slate-100';
                
                cycleHeader.innerHTML = `
                    <div class="flex items-center gap-2 min-w-0 flex-1 pr-2">
                        <button class="tree-toggle text-slate-500 hover:text-amber-700 transition-transform ${isCollapsed ? '-rotate-90' : 'rotate-0'}">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <span class="w-2.5 h-2.5 rounded-full shrink-0 shadow-sm" style="background-color: ${nodeBorderColor}"></span>
                        <span class="text-xs font-bold text-slate-800 truncate">${cycle.cycleName}</span>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span class="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded border" style="background-color: ${nodeBorderColor}15; color: ${nodeBorderColor}; border-color: ${nodeBorderColor}30">${selectedPacksInCycle.length}/${cycle.packs.length}</span>
                        <button class="deselect-cycle-btn text-slate-400 hover:text-rose-600 p-0.5 transition-colors" title="Deselect entire cycle">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                `;

                cycleHeader.addEventListener('click', (e) => {
                    if (e.target.closest('.deselect-cycle-btn')) return;
                    if (isCollapsed) {
                        collapsedTreeNodes.delete(cycle.cycleCode);
                    } else {
                        collapsedTreeNodes.add(cycle.cycleCode);
                    }
                    renderSelectedTree();
                });

                const deselectBtn = cycleHeader.querySelector('.deselect-cycle-btn');
                deselectBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleCycle(cycle, false);
                });

                cycleTreeNode.appendChild(cycleHeader);

                // Leaf Nodes (Selected Packs inside cycle)
                if (!isCollapsed) {
                    const packsList = document.createElement('div');
                    packsList.className = 'pl-7 pr-2 py-1.5 flex flex-col gap-1 bg-slate-50/40';

                    selectedPacksInCycle.forEach(pack => {
                        const packLeaf = document.createElement('div');
                        packLeaf.className = 'tree-branch flex items-center justify-between py-1 px-2 rounded hover:bg-slate-100 text-xs transition-colors group';
                        
                        packLeaf.innerHTML = `
                            <div class="flex items-center gap-2 min-w-0 flex-1 pr-2">
                                <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                <span class="font-semibold truncate text-[11px]" style="color: ${nodeBorderColor}" title="${pack.name}">${pack.name}</span>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <span class="font-mono text-[10px] font-bold" style="color: ${nodeBorderColor}">${pack.code}</span>
                                <button class="remove-pack-btn text-slate-400 group-hover:text-rose-600 transition-colors p-0.5" title="Remove pack">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                        `;

                        const removeBtn = packLeaf.querySelector('.remove-pack-btn');
                        removeBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            selectedPackCodes.delete(pack.code);
                            renderPacks(document.getElementById('pack-search').value);
                        });

                        packsList.appendChild(packLeaf);
                    });

                    cycleTreeNode.appendChild(packsList);
                }

                treeContainer.appendChild(cycleTreeNode);
            });
        }

        function updateFilterOutput() {
            const filterOutput = document.getElementById('filter-output');
            const copyBtn = document.getElementById('copy-btn');
            const openBtn = document.getElementById('open-ringsdb-btn');

            if (selectedPackCodes.size === 0) {
                filterOutput.innerText = 'Select packs to generate filter...';
                filterOutput.style.color = '#f3b217aa';
                copyBtn.disabled = true;
                openBtn.disabled = true;
                return;
            }

            const orderedSelectedCodes = ALL_PACKS_FLAT
                .filter(p => selectedPackCodes.has(p.code))
                .map(p => p.code);

            const filterString = `e:${orderedSelectedCodes.join('|')}`;

            filterOutput.innerText = filterString;
            filterOutput.style.color = '#f3b217';

            copyBtn.disabled = false;
            openBtn.disabled = false;

            copyBtn.onclick = () => {
                navigator.clipboard.writeText(filterString).then(() => {
                    showToast();
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = filterString;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast();
                });
            };

            openBtn.onclick = () => {
                const encodedFilter = encodeURIComponent(filterString);
                window.open(`https://ringsdb.com/find?q=${encodedFilter}`, '_blank');
            };
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('pack-search').addEventListener('input', (e) => {
                renderPacks(e.target.value);
            });

            document.getElementById('select-all-btn').addEventListener('click', () => {
                ALL_PACKS_FLAT.forEach(p => selectedPackCodes.add(p.code));
                renderPacks(document.getElementById('pack-search').value);
            });

            document.getElementById('clear-all-btn').addEventListener('click', () => {
                selectedPackCodes.clear();
                renderPacks(document.getElementById('pack-search').value);
            });

            renderPacks();
        });
    </script>
</body>
</html>
